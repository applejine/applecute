<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Modern PWA Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#4f46e5">
    <style>
        body { background-color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .phone-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #ffffff; box-shadow: 0 4px 20px rgba(0,0,0,0.08); position: relative; }
        .avatar-option { width: 55px; height: 55px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: all 0.2s; }
        .avatar-option.selected { border-color: #4f46e5; transform: scale(1.1); box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3); }
        .chat-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
        .reaction-btn { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 20px; padding: 2px 10px; font-size: 0.85rem; transition: all 0.15s; margin-right: 5px; }
        .reaction-btn:hover { background: #eef2ff; border-color: #6366f1; }
    </style>
</head>
<body>

<div class="phone-container d-flex flex-column">
    <nav class="navbar navbar-expand navbar-dark bg-dark sticky-top shadow-sm px-3" style="background: linear-gradient(135deg, #4f46e5, #3730a3) !important;">
        <div class="container-fluid p-0">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="/board">
                <span class="me-2">✨</span> 2026 Modern Chat
            </a>
            <div class="navbar-nav ms-auto align-items-center" id="nav-user-info">
                </div>
        </div>
    </nav>

    <div class="flex-grow-1 p-3">
        {% block content %}{% endblock %}
    </div>
</div>

<script>
    // PWA Service Worker 註冊
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register("/static/sw.js");
        });
    }

    // 全域導覽列使用者狀態渲染
    document.addEventListener("DOMContentLoaded", function() {
        const name = localStorage.getItem("chat_username");
        const avatar = localStorage.getItem("chat_avatar");
        const navUserInfo = document.getElementById("nav-user-info");
        
        if (name && avatar && navUserInfo) {
            navUserInfo.innerHTML = `
                <span class="text-white small me-2">${name}</span>
                <img src="${avatar}" class="rounded-circle bg-white" style="width:30px; height:30px; object-fit:cover;">
                <a href="#" onclick="logout()" class="btn btn-sm btn-outline-light ms-2 py-0 px-2" style="font-size:11px;">登出</a>
            `;
        }
    });

    function logout() {
        localStorage.clear();
        window.location.href = "/login";
    }
</script>
</body>
</html>
