{% extends 'base.html' %}
{% block content %}
<div class="py-2 text-center">
    <h3 class="fw-bold text-dark mb-1">2026 Modern Chat</h3>
    <p class="text-muted small">請輸入您的帳號密碼並挑選頭像</p>
    
    <div class="card border-0 shadow-sm p-4 mt-3 bg-light text-start">
        <form method="POST" id="loginForm">
            <input type="hidden" name="avatar" id="selectedAvatarInput" value="https://api.dicebear.com/7.x/adventurer/svg?seed=Felix">

            <div class="mb-4 text-center">
                <label class="form-label fw-bold text-secondary d-block">1. 挑選本次登入頭像</label>
                <div class="d-flex justify-content-center gap-3 my-2 flex-wrap">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Felix" class="avatar-option selected" onclick="selectAvatar(this)">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Aneka" class="avatar-option" onclick="selectAvatar(this)">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Jack" class="avatar-option" onclick="selectAvatar(this)">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Luna" class="avatar-option" onclick="selectAvatar(this)">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold text-secondary">帳號</label>
                <input type="text" name="username" class="form-control" placeholder="請輸入帳號" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold text-secondary">密碼</label>
                <input type="password" name="password" class="form-control" placeholder="請輸入密碼" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 border-0 shadow-sm" style="background: #4f46e5;">驗證並登入 🔑</button>
        </form>
        
        <div class="text-center mt-3">
            <a href="{{ url_for('register') }}" class="text-decoration-none small text-primary">還沒有帳號？點我建立新帳號</a>
        </div>
    </div>
</div>

<script>
    function selectAvatar(element) {
        document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        document.getElementById("selectedAvatarInput").value = element.src;
    }
</script>
{% endblock %}
